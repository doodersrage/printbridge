name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: printbridge:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (slice a 3MF inside the container)
        run: |
          docker run -d --name pb -p 8000:8000 printbridge:test
          ./scripts/smoke_test.sh http://localhost:8000 tests/fixtures/two-blocks.3mf || { docker logs pb; exit 1; }

      - uses: astral-sh/setup-uv@v7

      - name: Browser tests (Chromium driving the image, with a mock printer)
        run: |
          docker run -d --name pb-e2e --network host \
            -e PRINTBRIDGE_PORT=8746 -e PRINTBRIDGE_PRINTER_KIND=octoprint \
            -e PRINTBRIDGE_PRINTER_URL=http://127.0.0.1:8766 -e PRINTBRIDGE_PRINTER_API_KEY=e2e-key \
            printbridge:test
          uv sync --frozen
          uv run --with playwright playwright install --with-deps chromium
          PRINTBRIDGE_E2E=1 PRINTBRIDGE_E2E_URL=http://127.0.0.1:8746 \
            uv run --with playwright pytest tests/e2e -v || { docker logs pb-e2e | tail -100; exit 1; }

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
