services:
  printbridge:
    image: ghcr.io/doodersrage/printbridge:latest
    # To build from source instead of pulling the published image:
    # build: .
    container_name: printbridge
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - printbridge-data:/data
    environment:
      # Optional first-run defaults; can be changed later in the web UI (Settings).
      PRINTBRIDGE_PRINTER_KIND: ${PRINTBRIDGE_PRINTER_KIND:-creality_box}
      PRINTBRIDGE_PRINTER_URL: ${PRINTBRIDGE_PRINTER_URL:-}
      PRINTBRIDGE_PRINTER_API_KEY: ${PRINTBRIDGE_PRINTER_API_KEY:-}

volumes:
  printbridge-data:
