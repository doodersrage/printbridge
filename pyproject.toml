[project]
name = "printbridge"
version = "0.1.0"
description = "Web app that slices 3MF files for a Creality Ender-3 V3 SE and sends them to OctoPrint or Moonraker"
authors = [
    { name = "Robert McDowell", email = "doodersrage@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
printbridge = "printbridge:serve"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
