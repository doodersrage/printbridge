# Creality Ender-3 V3 SE base machine profile for the PrusaSlicer CLI.
# Stock Marlin firmware, 220x220x250 build volume, direct-drive "Sprite" extruder, CR-Touch.
printer_technology = FFF
printer_model =
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.32
gcode_flavor = marlin2
use_relative_e_distances = 1
use_firmware_retraction = 0
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.2
retract_lift_below = 249
retract_before_travel = 1.5
retract_layer_change = 1
wipe = 0
retract_length_toolchange = 0
z_offset = 0
machine_limits_usage = time_estimate_only
# Emit M73 P<percent> R<minutes> so the Wi-Fi Box and printer screen show progress
remaining_times = 1
silent_mode = 0
machine_max_acceleration_extruding = 2500
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 2500
machine_max_acceleration_x = 2500
machine_max_acceleration_y = 2500
machine_max_acceleration_z = 100
machine_max_acceleration_e = 5000
machine_max_feedrate_x = 250
machine_max_feedrate_y = 250
machine_max_feedrate_z = 5
machine_max_feedrate_e = 40
machine_max_jerk_x = 8
machine_max_jerk_y = 8
machine_max_jerk_z = 0.4
machine_max_jerk_e = 5
default_acceleration = 2500
travel_acceleration = 2500
first_layer_acceleration = 500
perimeter_acceleration = 1500
external_perimeter_acceleration = 1000
infill_acceleration = 2500
bridge_acceleration = 1000
skirts = 1
skirt_distance = 4
skirt_height = 1
min_skirt_length = 4
complete_objects = 0
gcode_comments = 0
gcode_label_objects = octoprint
gcode_substitutions =
thumbnails =
autoemit_temperature_commands = 1
output_filename_format = {input_filename_base}_{layer_height}mm_{printing_filament_types}_{print_time}.gcode
start_gcode = ; Ender-3 V3 SE start\nM220 S100 ; reset feedrate\nM221 S100 ; reset flowrate\nM140 S{first_layer_bed_temperature[initial_extruder]} ; start heating bed\nM104 S150 ; warm nozzle without oozing\nM190 S{first_layer_bed_temperature[initial_extruder]} ; wait for bed before homing so the probe measures it hot\nG90\nM83\nG28 ; home all axes\n@BED_MESH@\nM109 S{first_layer_temperature[initial_extruder]} ; heat nozzle to print temperature and wait\nG92 E0\nG1 Z2.0 F3000\nG1 X1.0 Y20 Z0.28 F5000.0 ; move to purge start\nG1 X1.0 Y145.0 Z0.28 F1500.0 E15 ; first purge line\nG1 X1.3 Y145.0 Z0.28 F5000.0\nG1 X1.3 Y20 Z0.28 F1500.0 E15 ; second purge line\nG92 E0\nG1 Z2.0 F3000 ; lift before starting print
end_gcode = ; Ender-3 V3 SE end\nG91 ; relative positioning\nG1 E-2 F2700 ; retract\nG1 E-2 Z0.2 F2400 ; retract and raise Z\nG1 X5 Y5 F3000 ; wipe out\nG1 Z10 ; raise Z more\nG90 ; absolute positioning\nG1 X0 Y{print_bed_max[1]*0.95} ; present print\nM106 S0 ; turn off part fan\nM104 S0 ; turn off nozzle\nM140 S0 ; turn off bed\nM84 X Y E ; disable motors except Z
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;{layer_z}\n
layer_gcode = ;AFTER_LAYER_CHANGE\nG92 E0\n
